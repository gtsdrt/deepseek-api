<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deepseek Azure Resource Manager</title>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            margin: 0;
            min-height: 100vh;
            background: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            max-width: 1500px;
            width: 100%;
            background: white;
            padding: 30px 35px;
            border-radius: 12px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.12);
        }
        h1, h2 { margin-top: 0; color: #1a1a1a; }
        h1 { font-size: 26px; }
        h2 { font-size: 22px; }
        p { color: #444; margin: 8px 0 12px; }
        label { font-weight: 600; display: block; margin: 12px 0 4px; }
        select, input[type="text"], input[type="password"], textarea {
            width: 100%;
            padding: 10px 12px;
            margin: 6px 0 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 15px;
            background: white;
        }
        select:focus, input:focus, textarea:focus {
            border-color: #0078d4;
            outline: none;
            box-shadow: 0 0 0 2px rgba(0,120,212,0.25);
        }
        textarea { height: 120px; resize: vertical; font-family: inherit; }
        button {
            background: #0078d4;
            color: white;
            border: none;
            padding: 12px 28px;
            border-radius: 6px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.15s;
            margin-right: 10px;
        }
        button:hover { background: #005a9e; }
        button.secondary { background: #6c757d; }
        button.secondary:hover { background: #5a6268; }
        #result {
            margin-top: 20px;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 6px;
            border: 1px solid #e9ecef;
            white-space: pre-wrap;
            word-wrap: break-word;
            font-size: 15px;
            line-height: 1.5;
            min-height: 80px;
        }
        .error { color: #d32f2f; }
        .success { color: #2e7d32; }
        .loading { color: #6c757d; }
        #loginMessage { margin-top: 10px; font-weight: 500; }
        .flex-row { display: flex; align-items: center; flex-wrap: wrap; gap: 10px; }
        .footer-note {
            margin-top: 25px;
            font-size: 13px;
            color: #888;
            border-top: 1px solid #eee;
            padding-top: 15px;
            text-align: center;
        }
        @media (max-width: 500px) {
            .container { padding: 20px; }
            button { width: 100%; margin-bottom: 8px; }
        }
    </style>
</head>
<body>
<div class="container" id="app">
    <!-- 登录面板 -->
    <div id="loginPanel">
        <h2>🔐 登录Login</h2>
        <p>Enter the account credentials to access the Azure Resource Manager.</p>
        <label for="username">Username</label>
        <input type="text" id="username" placeholder="" value="">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="" value="">
        <button onclick="login()">Login</button>
        <div id="loginMessage"></div>
    </div>

    <!-- 查询面板 -->
    <div id="queryPanel" style="display:none;">
        <h1>🛠️ Azure Resource Manager</h1>
        <p>Enter natural language commands to query Azure resource information.</p>

        <label for="subscriptionSelect">选择订阅 Select Subscription</label>
        <select id="subscriptionSelect"><option value="">加载中...</option></select>

        <label for="promptInput">指令</label>
        <textarea id="promptInput" placeholder="输入指令">list all virtual networks in the subscription</textarea>

        <div class="flex-row">
            <button onclick="callAgent()">🚀 发送查询</button>
            <button onclick="exportResult()" class="secondary">📥 导出结果</button>
            <button onclick="exportCSV('storage')" class="secondary">📥 导出存储</button>
            <button onclick="exportCSV('vm')" class="secondary">📥 导出虚拟机</button>
            <button onclick="openCloudShell()" class="secondary">☁️ Azure CLI</button>
            <button class="secondary" onclick="logout()">退出登录</button>
        </div>

        <div id="result">等待查询...</div>
        <div class="footer-note">💡 提示：按 <kbd>Ctrl+Enter</kbd> 快速发送</div>
    </div>
</div>

<script>
    // ========== 配置区 ==========
    const BASE_URL = "https://gtsdrt-apim-frontdoor-d9cnbuape0adhdgj.a01.azurefd.net/deepseek-api";
    const APIM_SUBSCRIPTION_KEY = "ea124885f20b4e63af94779b439f4039";
    // =============================

    let authToken = localStorage.getItem("authToken") || "";

    // ---------- 工具函数 ----------
    function isTokenExpired(token) {
        if (!token) return true;
        try {
            const payload = JSON.parse(atob(token.split('.')[1]));
            const now = Math.floor(Date.now() / 1000);
            return payload.exp < now;
        } catch (e) {
            return true; // 解析失败视为过期
        }
    }

    function clearSessionAndLogout() {
        localStorage.removeItem('authToken');
        localStorage.removeItem('selectedSubscriptionId');
        authToken = '';
        showLoginPanel();
        document.getElementById('result').innerHTML = '会话已过期，请重新登录。';
        document.getElementById('loginMessage').innerHTML = '';
        document.getElementById('password').value = '';

    }

    // ---------- 页面加载 ----------
    window.addEventListener('DOMContentLoaded', function() {
        if (authToken) {
            if (isTokenExpired(authToken)) {
                clearSessionAndLogout();
            } else {
                showQueryPanel();
                loadSubscriptions();
            }
        } else {
            showLoginPanel();
        }
    });

    function showLoginPanel() {
        document.getElementById('loginPanel').style.display = 'block';
        document.getElementById('queryPanel').style.display = 'none';
    }

    function showQueryPanel() {
        // 如果 token 已过期，清除并跳转登录
        if (authToken && isTokenExpired(authToken)) {
            clearSessionAndLogout();
            return;
        }
        document.getElementById('loginPanel').style.display = 'none';
        document.getElementById('queryPanel').style.display = 'block';
        if (authToken && document.getElementById('subscriptionSelect').options.length <= 1) {
            loadSubscriptions();
        }
    }

    // ---------- 导出 CSV ----------
    function exportCSV(resourceType) {
        // 检查 token 是否过期
        if (authToken && isTokenExpired(authToken)) {
            clearSessionAndLogout();
            return;
        }
        if (!authToken) {
            alert('请先登录');
            showLoginPanel();
            return;
        }

        const subscriptionId = document.getElementById('subscriptionSelect').value;
        const resourceGroup = prompt("请输入资源组名称（留空则导出整个订阅）：") || "";
        if (!subscriptionId) {
            alert("请先选择订阅");
            return;
        }
        let url = `${BASE_URL}/export_data?resource_type=${resourceType}&subscription_id=${subscriptionId}`;
        if (resourceGroup.trim()) url += `&resource_group_name=${encodeURIComponent(resourceGroup.trim())}`;
        fetch(url, {
            headers: {
                'Authorization': `Bearer ${authToken}`,
                'Ocp-Apim-Subscription-Key': APIM_SUBSCRIPTION_KEY
            }
        })
        .then(response => {
            if (!response.ok) throw new Error(`HTTP ${response.status}`);
            return response.blob();
        })
        .then(blob => {
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = `${resourceType}_${new Date().toISOString().slice(0,10)}.csv`;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            URL.revokeObjectURL(link.href);
        })
        .catch(error => alert(`导出失败: ${error.message}`));
    }
    
    function openCloudShell() {
    window.open('https://shell.azure.com', '_blank');
    }

    // ---------- 导出结果 ----------
    function exportResult() {
        const resultDiv = document.getElementById('result');
        const content = resultDiv.innerText || resultDiv.textContent;
        if (!content || content.trim() === '' || content === '等待查询...' || content === '登录成功，请发送查询。') {
            alert('没有可导出的查询结果，请先发送查询。');
            return;
        }
        const timestamp = new Date().toISOString().slice(0, 19).replace(/[:-]/g, '');
        const blob = new Blob([content], { type: 'text/plain;charset=utf-8' });
        const link = document.createElement('a');
        link.href = URL.createObjectURL(blob);
        link.download = `query_result_${timestamp}.txt`;
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        URL.revokeObjectURL(link.href);
    }

    // ---------- 加载订阅 ----------
    async function loadSubscriptions() {
        // 检查 token 是否过期
        if (authToken && isTokenExpired(authToken)) {
            clearSessionAndLogout();
            return;
        }
        if (!authToken) {
            const select = document.getElementById('subscriptionSelect');
            select.innerHTML = '<option value="">请先登录</option>';
            return;
        }

        const select = document.getElementById('subscriptionSelect');
        try {
            const response = await fetch(`${BASE_URL}/list_subscriptions`, {
                headers: {
                    'Authorization': `Bearer ${authToken}`,
                    'Ocp-Apim-Subscription-Key': APIM_SUBSCRIPTION_KEY
                }
            });
            if (response.ok) {
                const data = await response.json();
                if (data.subscriptions && data.subscriptions.length > 0) {
                    select.innerHTML = data.subscriptions.map(sub =>
                        `<option value="${sub.id}">${sub.name} (${sub.id})</option>`
                    ).join('');
                    const savedId = localStorage.getItem('selectedSubscriptionId');
                    if (savedId && data.subscriptions.some(s => s.id === savedId)) {
                        select.value = savedId;
                    } else {
                        select.value = data.subscriptions[0].id;
                        localStorage.setItem('selectedSubscriptionId', data.subscriptions[0].id);
                    }
                } else {
                    select.innerHTML = '<option value="">未找到订阅</option>';
                }
            } else if (response.status === 401) {
                // token 无效，清除会话
                clearSessionAndLogout();
            } else {
                const err = await response.text();
                select.innerHTML = `<option value="">加载失败: ${err}</option>`;
            }
        } catch (error) {
            console.error('加载订阅列表失败:', error);
            select.innerHTML = '<option value="">加载失败</option>';
        }
    }

    // ---------- 登录 ----------
    async function login() {
        const username = document.getElementById('username').value.trim();
        const password = document.getElementById('password').value.trim();
        const msg = document.getElementById('loginMessage');

        if (!username || !password) {
            msg.innerHTML = '<span class="error">请输入用户名和密码</span>';
            return;
        }

        msg.innerHTML = '⏳ 登录中...';
        try {
            const response = await fetch(`${BASE_URL}/login`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Ocp-Apim-Subscription-Key': APIM_SUBSCRIPTION_KEY
                },
                body: JSON.stringify({ username, password })
            });
            const data = await response.json();
            if (response.ok) {
                localStorage.setItem('authToken', data.token);
                authToken = data.token;
                msg.innerHTML = '<span class="success">✅ 登录成功！</span>';
                showQueryPanel();
                document.getElementById('result').innerHTML = '登录成功，请发送查询。';
                loadSubscriptions();
            } else {
                msg.innerHTML = `<span class="error">❌ 登录失败: ${data.error || '未知错误'}</span>`;
            }
        } catch (error) {
            msg.innerHTML = `<span class="error">❌ 请求错误: ${error.message}</span>`;
        }
    }

    // ---------- 发送查询 ----------
    async function callAgent() {
        // 检查 token 是否过期
        if (authToken && isTokenExpired(authToken)) {
            clearSessionAndLogout();
            return;
        }
        if (!authToken) {
            document.getElementById('result').innerHTML = '<span class="error">请先登录</span>';
            showLoginPanel();
            return;
        }

        const prompt = document.getElementById('promptInput').value.trim();
        const resultDiv = document.getElementById('result');
        if (!prompt) {
            resultDiv.innerHTML = '<span class="error">请输入查询内容</span>';
            return;
        }

        const subscriptionId = document.getElementById('subscriptionSelect').value;
        if (!subscriptionId) {
            resultDiv.innerHTML = '<span class="error">请选择有效的订阅</span>';
            return;
        }

        resultDiv.innerHTML = '<span class="loading">⏳ 处理中...</span>';

        try {
            const response = await fetch(`${BASE_URL}/infra_agent`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${authToken}`,
                    'Ocp-Apim-Subscription-Key': APIM_SUBSCRIPTION_KEY
                },
                body: JSON.stringify({
                    prompt: prompt,
                    subscription_id: subscriptionId
                })
            });

            if (!response.ok) {
                let errorMsg = `HTTP ${response.status}`;
                try {
                    const errData = await response.json();
                    errorMsg += `: ${errData.error || errData.message || ''}`;
                } catch (_) {}
                if (response.status === 401) {
                    clearSessionAndLogout();
                    return;
                }
                throw new Error(errorMsg);
            }

            const data = await response.json();
            resultDiv.innerHTML = data.response || JSON.stringify(data, null, 2);
        } catch (error) {
            resultDiv.innerHTML = `<span class="error">❌ 错误: ${error.message}</span>`;
        }
    }

    // ---------- 手动退出 ----------
    function logout() {
        localStorage.removeItem('authToken');
        localStorage.removeItem('selectedSubscriptionId');
        authToken = '';
        showLoginPanel();
        document.getElementById('loginMessage').innerHTML = '';
        document.getElementById('result').innerHTML = '等待查询...';
        const select = document.getElementById('subscriptionSelect');
        select.innerHTML = '<option value="">请先登录</option>';
        document.getElementById('password').value = '';
    }

    // Ctrl+Enter 快捷键
    document.getElementById('promptInput').addEventListener('keydown', function(e) {
        if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
            e.preventDefault();
            callAgent();
        }
    });
    setInterval(() => {
    if (authToken && isTokenExpired(authToken)) {
        clearSessionAndLogout();
    }
    }, 30000); 
</script>
</body>
</html>
