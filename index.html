<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deepseek Azure Tool</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f7f6; margin: 0; padding: 20px; color: #333; }
        .container { max-width: 1000px; margin: 0 auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        h1 { color: #0078D4; border-bottom: 2px solid #eee; padding-bottom: 10px; }
        h2 { color: #444; font-size: 1.2rem; margin-top: 0; }
        .hidden { display: none !important; }
        
        /* Form Elements */
        input, select, textarea, button { 
            padding: 12px; margin: 8px 0; width: 100%; box-sizing: border-box; 
            border: 1px solid #ddd; border-radius: 6px; font-size: 14px; 
        }
        textarea { height: 120px; resize: vertical; font-family: monospace; }
        button { 
            background: #0078D4; color: white; border: none; cursor: pointer; 
            font-weight: bold; transition: background 0.2s; 
        }
        button:hover { background: #005a9e; }
        button:disabled { background: #ccc; cursor: not-allowed; }
        
        /* Button Groups */
        .btn-group { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 15px; }
        .btn-group button { flex: 1; min-width: 150px; }
        .btn-success { background: #107C10; }
        .btn-success:hover { background: #0b5e0b; }
        .btn-secondary { background: #6c757d; }
        .btn-secondary:hover { background: #5a6268; }
        .btn-danger { background: #d13438; }
        .btn-danger:hover { background: #a52a2d; }

        /* Output Console */
        #output { 
            background: #1e1e1e; color: #d4d4d4; padding: 20px; border-radius: 8px; 
            height: 400px; overflow-y: auto; white-space: pre-wrap; 
            font-family: 'Consolas', 'Courier New', monospace; font-size: 14px; 
            border: 1px solid #333; margin-top: 20px;
        }
        .hint { font-size: 12px; color: #666; margin-top: 5px; text-align: right; }
        .loader { border: 4px solid #f3f3f3; border-top: 4px solid #0078D4; border-radius: 50%; width: 30px; height: 30px; animation: spin 1s linear infinite; margin: 20px auto; display: none; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <div class="container">
        <h1>🌩️ Deepseek Azure Tool</h1>

        <!-- 登录区域 -->
        <div id="login-section">
            <h2>🔐 登录 Login</h2>
            <p>Enter the account credentials to access the Azure Resource Manager.</p>
            <input type="text" id="username" placeholder="Username" value="admin">
            <input type="password" id="password" placeholder="Password" value="password123">
            <button id="btn-login">Login</button>
        </div>

        <!-- 主控制台区域 -->
        <div id="main-section" class="hidden">
            <h2>🛠️ Deepseek Azure Tool</h2>
            <p>Enter natural language commands to query Azure resource information.</p>
            
            <label>选择订阅 Select Subscription</label>
            <select id="subscriptionSelect">
                <option value="">加载中...</option>
            </select>

            <label>指令 Instruction</label>
            <textarea id="prompt" placeholder="list all virtual networks in the subscription"></textarea>
            <div class="hint">💡 提示：按 Ctrl+Enter 快速发送</div>

            <div class="btn-group">
                <button id="btn-send" class="btn-primary">🚀 发送查询</button>
                <button id="btn-gen-arch" class="btn-success">📊 生成架构图</button>
                <button id="btn-export-drawio" class="btn-success">📐 导出 Draw.io</button>
            </div>
            
            <div class="btn-group">
                <button id="btn-export-res" class="btn-secondary">📥 导出结果</button>
                <button id="btn-export-storage" class="btn-secondary">📥 导出存储</button>
                <button id="btn-export-vm" class="btn-secondary">📥 导出虚拟机</button>
                <button id="btn-cli" class="btn-secondary">☁️ Azure CLI</button>
                <button id="btn-logout" class="btn-danger">退出登录</button>
            </div>

            <div class="loader" id="loader"></div>
            <div id="output">等待查询...</div>
        </div>
    </div>

    <script>
        const API_BASE = '/api'; // 根据您的实际部署地址修改
        let token = localStorage.getItem('jwt_token');

        // 初始化 UI 状态
        if (token) {
            document.getElementById('login-section').classList.add('hidden');
            document.getElementById('main-section').classList.remove('hidden');
            loadSubscriptions();
        }

        // 登录逻辑
        document.getElementById('btn-login').addEventListener('click', async () => {
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            try {
                const res = await fetch(`${API_BASE}/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                const data = await res.json();
                if (res.ok && data.token) {
                    token = data.token;
                    localStorage.setItem('jwt_token', token);
                    location.reload();
                } else {
                    alert('登录失败: ' + (data.error || '未知错误'));
                }
            } catch (e) { alert('网络错误'); }
        });

        // 加载订阅列表
        async function loadSubscriptions() {
            const select = document.getElementById('subscriptionSelect');
            try {
                const res = await fetch(`${API_BASE}/list_subscriptions`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const data = await res.json();
                select.innerHTML = '<option value="">-- 请选择订阅 --</option>';
                if (data.subscriptions) {
                    data.subscriptions.forEach(sub => {
                        const opt = document.createElement('option');
                        opt.value = sub.id;
                        opt.textContent = `${sub.name} (${sub.id})`;
                        select.appendChild(opt);
                    });
                }
            } catch (e) { console.error(e); }
        }

        // 通用输出更新
        function updateOutput(text) {
            document.getElementById('output').innerText = text;
        }

        // 发送自然语言查询
        async function sendQuery() {
            const subId = document.getElementById('subscriptionSelect').value;
            const prompt = document.getElementById('prompt').value;
            if (!subId) return alert('请先选择订阅');
            if (!prompt) return alert('请输入指令');

            updateOutput('⏳ 正在执行查询...');
            document.getElementById('loader').style.display = 'block';
            try {
                const res = await fetch(`${API_BASE}/infra_agent`, {
                    method: 'POST',
                    headers: { 
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ prompt, subscription_id: subId })
                });
                const data = await res.json();
                updateOutput(data.response || JSON.stringify(data, null, 2));
            } catch (e) { updateOutput('❌ 查询失败: ' + e.message); }
            finally { document.getElementById('loader').style.display = 'none'; }
        }

        // 触发文件下载
        async function triggerDownload(url, defaultFilename) {
            const subId = document.getElementById('subscriptionSelect').value;
            if (!subId && !url.includes('export_drawio')) return alert('请先选择订阅');
            
            updateOutput('⏳ 正在准备下载文件...');
            try {
                const finalUrl = url.includes('?') ? `${url}&subscription_id=${subId}` : `${url}?subscription_id=${subId}`;
                const res = await fetch(finalUrl, { headers: { 'Authorization': `Bearer ${token}` } });
                if (!res.ok) throw new Error(await res.text());
                
                const blob = await res.blob();
                const downloadUrl = window.URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = downloadUrl;
                a.download = defaultFilename;
                document.body.appendChild(a);
                a.click();
                a.remove();
                window.URL.revokeObjectURL(downloadUrl);
                updateOutput('✅ 文件下载成功！');
            } catch (e) { updateOutput('❌ 导出失败: ' + e.message); }
        }

        // 绑定事件
        document.getElementById('btn-send').addEventListener('click', sendQuery);
        document.getElementById('btn-gen-arch').addEventListener('click', () => triggerDownload(`${API_BASE}/export_drawio`, `azure_architecture_${Date.now()}.drawio`));
        document.getElementById('btn-export-drawio').addEventListener('click', () => triggerDownload(`${API_BASE}/export_drawio`, `azure_architecture_${Date.now()}.drawio`));
        
        document.getElementById('btn-export-storage').addEventListener('click', () => triggerDownload(`${API_BASE}/export?resource_type=storage`, `storage_accounts_${Date.now()}.csv`));
        document.getElementById('btn-export-vm').addEventListener('click', () => triggerDownload(`${API_BASE}/export?resource_type=vm`, `virtual_machines_${Date.now()}.csv`));
        
        document.getElementById('btn-export-res').addEventListener('click', () => {
            const text = document.getElementById('output').innerText;
            const blob = new Blob([text], { type: 'text/plain' });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = `query_results_${Date.now()}.txt`;
            a.click();
        });

        document.getElementById('btn-cli').addEventListener('click', () => updateOutput('☁️ Azure CLI 终端功能开发中...'));
        
        document.getElementById('btn-logout').addEventListener('click', () => {
            localStorage.removeItem('jwt_token');
            location.reload();
        });

        // Ctrl+Enter 快捷键
        document.getElementById('prompt').addEventListener('keydown', (e) => {
            if (e.ctrlKey && e.key === 'Enter') sendQuery();
        });
    </script>
</body>
</html>
